<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Base64 在线编码解码 | Base64 文件转换</title>
    <meta name="keywords" content="Base64,Base64编码,Base64解码,Base64加密,Base64解密">
    <script src="static/base64/hm.js"></script>
    <script src="static/js/jquery.min.js" type="text/javascript"></script>
    <script src="static/base64/common.js" type="text/javascript"></script>
    <script src="static/base64/base64.js" type="text/javascript"></script>
    <script src="static/js/bootstrap.min.js" type="text/javascript"></script>
    <link href="static/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous" rel="stylesheet">
    <style type="text/css">
        body {
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
            font-family: 'Hiragino Sans GB', 'Microsoft YaHei';
        }
        a, input, button {
            outline: none !important;
        }
        .main {
            max-width: 950px;
            padding: 19px 29px 29px;
            margin: 0 auto 20px;
            background-color: #fff;
            border: 1px solid #e5e5e5;
            -webkit-border-radius: 5px;
            -moz-border-radius: 5px;
            border-radius: 5px;
            -webkit-box-shadow: 0 1px 2px rgba(0,0,0,.05);
            -moz-box-shadow: 0 1px 2px rgba(0,0,0,.05);
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }
        small { color: #777; }
        .l { float: left; }
        .r { float: right; }
        .mr2 { margin-right: 2px; }
        .mr3 { margin-right: 3px; }
        .mr4 { margin-right: 4px; }
        .mr6 { margin-right: 6px; }
        .mr8 { margin-right: 8px; }
        .ml2 { margin-left: 2px; }
        .ml3 { margin-left: 3px; }
        .ml4 { margin-left: 4px; }
        .ml6 { margin-left: 6px; }
        .ml8 { margin-left: 8px; }
        .label-site {
            font-size: 14px;
            vertical-align: middle;
            margin-right: 6px;
        }
        .icon-site {
            vertical-align: text-top;
            margin-right: 2px;
            width: 16px;
            height: 16px;
        }
        .breadcrumb > li + li::before {
            content: "| ";
        }
        .text {
            width: 100%;
            height: 150px;
        }
        .btn-code {
            padding: 6px 16px;
        }
        .form-group {
            margin: 10px;
        }
        .replace {
            width: 40px;
            padding: 2px;
            height: 20px;
            display: inline;
            font-size: 12px;
            text-align: center;
        }
        .row {
            margin-top: 4px;
        }
        #img2base54Area li {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        #img2base54Area iframe,
        #img2base54Area embed,
        #img2base54Area img {
            width: 100%;
            max-width: 100%;
            display: block;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main">
        <h3>Base64 在线编码解码</h3>
        <textarea placeholder="请输入要进行 Base64 编码或解码的字符" name="text" id="text" class="form-control text" cols="80" rows="6"></textarea>
        <div style="margin:10px 0;">
            <button id="encode" class="btn btn-primary btn-code">编码 (Encode)</button>
            <button id="transFile2" class="btn btn-primary btn-code">转换文件 (Encode)</button>
            <button id="decode" class="btn btn-default btn-code">解码 (Decode)</button>
            <button id="exchange" class="btn btn-default">↕ 交换</button>
            <span style="color:#888; margin-left: 5px;">(<span id="hkf">编码</span>快捷键：<small id="kbd"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></small> )</span>
        </div>
        <h5>Base64 编码或解码的结果：<span class="r"><label><input type="checkbox" id="as" style="vertical-align: bottom;"> 编/解码后自动全选</label></span></h5>
        <textarea name="result" id="result" class="form-control text" cols="80" rows="6" placeholder=""></textarea>
        <div id="alert" style="margin:10px 0;" class="alert alert-success">读取完毕。</div>
        <ul id="img2base54Area" style="list-style: none; padding: 0;"></ul>
        <div class="well">也可以选择图片文件来获取它的 Base64 编码的 DataURI 形式：<input style="display: inline;" id="image_input" accept="image/*" type="file"></div>
        <hr>
        <div id="config" style="display:none;">
            <!-- 配置部分内容保持不变 -->
        </div>
    </div>
</div>
<script>
    function createFullscreenButton(targetId) {
        return $("<button class='btn btn-primary btn-sm' style='margin-left: 8px;'>全屏 (FullScreen)</button>")
            .on("click", function () {
                const el = document.getElementById(targetId);
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
                else alert("您的浏览器不支持全屏 API");
            });
    }

    $('#transFile2').on("click", function() {
        let fileList = [];
        let base64Text = $("#text").val().trim();  
        if (!base64Text) {
            alert("请输入Base64字符串");
            return;
        }

        $("#img2base54Area").empty();  
        let matches = base64Text.match(/data:.*?base64,[\s\S]*?(?=$|\n)/g) || [base64Text];

        matches.forEach((dataUrl, index) => {
            if (!/^data:/.test(dataUrl)) return;

            const [meta, content] = dataUrl.split(',');
            const mime = meta.match(/data:([^;]+);/)[1];
            const [type, subtype] = mime.split('/');
            const fileType = subtype === 'plain' ? 'txt' : subtype === 'svg+xml' ? 'svg' : subtype === 'jpeg' ? 'jpg' : subtype;
            const fileName = `${index + 1}.${fileType}`;

            let $li = $("<li>").css({ position: "relative", display: "inline-block", verticalAlign: "top" });
            let $content;
            const embedId = `content_embed_${index}`;

            if (type === 'text') {
                const decoded = atob(content);
                $content = $("<textarea>")
                    .attr({ readonly: true, rows: 10, id: embedId })
                    .css({ width: "100%", overflow: "scroll" }).val(decoded);
            } else if (type === 'image') {
                $content = $("<img>")
                    .attr("id", embedId)
                    .attr("src", dataUrl)
                    .css({ maxWidth: "100%" });
            } else if (type === 'application' && fileType === 'pdf') {
                $content = $("<embed>")
                    .attr("id", embedId)
                    .attr("src", dataUrl)
                    .attr("type", "application/pdf")
                    .css({ width: "100%", height: "400px", border: "1px solid #ccc" });
            } else {
                $content = $("<div>")
                    .attr("id", embedId)
                    .css({
                        borderBottom: "1px solid #ddd",
                        textAlign: "center",
                        height: "150px",
                        lineHeight: "150px"
                    })
                    .text("暂不支持预览");
            }

            const $info = $(`
                <div class="well" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 10px;">
                    <p style="width:50%; margin: 0 0 0 5px; word-wrap: break-word;">
                        <span class="filename">${index + 1}</span>.${fileType}
                    </p>
                    <div style="display: flex; gap: 8px; margin-right:5px;">
                        <button class="btn btn-primary btn-sm rename">重命名 (Rename)</button>
                        <a class="btn btn-primary btn-sm" href="${dataUrl}" download="${fileName}">下载 (Download)</a>
                        <button class="btn btn-primary btn-sm fullscreen-btn" data-target="${embedId}">全屏 (FullScreen)</button>
                    </div>
                </div>
            `);

            $li.append($content).append($info);

            $("#img2base54Area").append($li);
            $("#img2base54Area").show();

            fileList.push({ file_name: index + 1, url: dataUrl, file_type: fileType });
        });

        // 统一事件委托处理
        $(document).on('click', '#img2base54Area .rename', function() {
            const $li = $(this).closest("li");
            const $filenameSpan = $li.find("span.filename");
            const oldName = $filenameSpan.text();
            const newName = prompt("请输入新文件名", oldName);
            if (!newName || newName === oldName) return;

            $filenameSpan.text(newName);

            const $downloadBtn = $li.find("a.btn[download]");
            const fileType = $downloadBtn.attr("download").split('.').pop(); 
            const fullName = `${newName}.${fileType}`;
            $downloadBtn.attr("download", fullName).attr("title", fullName);
        });

        $(document).on('click', '#img2base54Area .fullscreen-btn', function(e) {
            e.preventDefault();
            const targetId = $(this).data('target');
            const el = document.getElementById(targetId);
            if (!el) {
                console.error('Target element not found:', targetId);
                return;
            }

            try {
                if (el.requestFullscreen) {
                    el.requestFullscreen();
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                } else {
                    alert("您的浏览器不支持全屏 API");
                }
            } catch (error) {
                console.error('Fullscreen error:', error);
                alert("全屏显示失败，请检查浏览器设置");
            }
        });

        $("#img2base54Area").show();
    });
</script>
</body>
</html>
